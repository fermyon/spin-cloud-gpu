[package]
name = "spin-cloud-gpu"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
clap = { version = "3.2.25", features = ["derive", "env"] }
regex = "1.12"
tracing = { version = "0.1", features = ["log"] }
uuid = { version = "1.18.1", features = ["v4"] }
time = "0.3.44"
dialoguer = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8.23"

[build-dependencies]
vergen = { version = "^8.3.2", default-features = false, features = [
  "build",
  "git",
  "gitcl",
  "cargo",
] }
